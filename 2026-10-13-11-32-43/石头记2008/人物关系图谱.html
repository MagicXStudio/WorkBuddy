<script>
const SRC = "# 人物关系图谱\n\n> 一百二十回，一百二十个位置。此图表的是\"谁跟谁有关系\"，更图的是\"这关系靠什么撑着、什么时候断的\"。\n> 图谱据正文（第001—120回）编成。**凡正文只以称谓出现、未点名的，标\"正文称某某\"**；凡原著有、正文未写明的，标\"（原著如此，正文未点）\"。凡引原著处皆凭记忆，未逐字核对版本。\n\n---\n\n## 〇 · 一句话概述\n\n**这本书里没有\"家族\"这回事，只有四样东西把人连在一起：血缘、婚书、工资、欠条。**\n\n血缘是天给的，改不了；婚书是两张纸，可以签也可以撕；工资是每个月打进来的，断了就断；欠条最轻，一张纸，却是全书唯一到最后还有人认的东西。\n\n一百二十回，写的就是这四样东西一样一样失效的过程。**血缘失效于分家，婚书失效于协议，工资失效于清退。** 只有欠条没有失效——因为它最轻，轻到没有人想起来去赖它。\n\n到第120回，前三样全没了，剩下一张纸、一句话。而在这四样之外，还有第五样，正文里一次也没叫过它的名字——\n\n**记得。**\n\n| 四样 | 谁靠着它活着 | 什么时候失效 | 失效以后 |\n|---|---|---|---|\n| 血缘 | 贾母、贾政、王夫人、李纨、巧姐 | 053 祭祖之后各家各算；118 舅舅来接孩子 | 亲戚成了\"有手续的人\" |\n| 婚书 | 凤姐、迎春、宝钗、夏金桂 | 079 误嫁；097 一盒喜糖；103 证明“确实是夫妻” | 婚姻成了\"证明你是他妻子\" |\n| 工资 | 袭人、晴雯、平儿、鸳鸯、门岗、园子里所有人 | 074 抄检；077 \"已走\"；111 \"已处理\" | 人成了名单上的一行 |\n| 欠条 | 刘姥姥、老甄、贾雨村 | 还没有失效（只是没有人再提） | 唯一没失效的那样 |\n\n---\n\n## 一 · 主干：贾氏家族\n\n### 1.1 图谱（可渲染 Mermaid；不能渲染见 1.2 文字版）\n\n```mermaid\ngraph TD\n    JIA[\"贾母 · 老太太<br/>2008 年八十三岁 · 第110回寿终\"]\n    JIA --> S1[\"长房 · 贾赦 × 邢夫人<br/>只分钱 · 第046回生事\"]\n    JIA --> S2[\"二房 · 贾政 × 王夫人<br/>董事长 · 掌实权\"]\n    JIA --> S3[\"女儿 · 贾敏 × 林如海<br/>（均已故）\"]\n\n    S1 --> YINGC[\"迎春 · 1987<br/>第079回误嫁 · 第109回死\"]\n\n    S2 --> YUAN[\"元春 · 1983<br/>第016回高升 · 第095回死\"]\n    S2 --> ZHU[\"贾珠 · 早逝<br/>（正文未点名，只以“寡居”带过）\"]\n    ZHU --> LI[\"李纨 · 1980\"]\n    LI --> LAN[\"贾兰 · 少年\"]\n    S2 --> BAO[\"宝玉 · 1989<br/>第三代唯一男丁\"]\n    S2 --> TAN[\"探春 · 1987 · 庶出<br/>第100回远调\"]\n    S2 --> HUAN[\"贾环 · 庶出<br/>第118回出头\"]\n\n    S3 --> DAI[\"黛玉 · 1989<br/>第098回死\"]\n\n    BAO ---|\"第097回 一盒喜糖\"| BC[\"宝钗 · 1988\"]\n    BAO -.->|\"2008—2017 无一句话说成\"| DAI\n    BAO -.->|\"生活助理 · 第119回出嫁\"| XIREN[\"袭人 · 1988\"]\n    BAO -.->|\"生活助理 · 第077回死\"| QINGWEN[\"晴雯 · 1990\"]\n```\n\n### 1.2 文字版（家族树）\n\n```\n贾母（老太太，集团创始人遗孀）\n├── 长房：贾赦 × 邢夫人\n│   └── 迎春（1987）────────── 第079回嫁出资方远亲，第109回死\n├── 二房：贾政 × 王夫人\n│   ├── 元春（1983）────────── 第016回进体制，第095回病故（一条推送）\n│   ├── 贾珠（早逝）× 李纨（1980）\n│   │   └── 贾兰（少年）────── 第088回\"家法\"之后无交代\n│   ├── 宝玉（1989）────────── 全书中心，第三代唯一男丁\n│   ├── 探春（1987，赵姨娘所出）── 第056回改革，第100回远调五年\n│   └── 贾环（赵姨娘所出）──── 第025回投毒，第118回拿\"处理决定\"当武器\n└── 女儿：贾敏 × 林如海（均故）\n    └── 黛玉（1989）────────── 2008 进府，第098回死\n\n旁支（宁国府）：贾珍 × 尤氏\n├── 贾蓉 × 秦可卿 ──────────── 第012回可卿死（一面镜子）\n└── 惜春（1990，贾珍之妹）──── 第115回注销手机号，走了\n```\n\n### 1.3 这个家里，谁靠什么活着\n\n| 人 | 位置 | 靠什么 | 到哪一回靠不住了 |\n|---|---|---|---|\n| 贾母 | 精神股东，不持股 | 一句话能定生死 | 108 生辰十人的桌来七个；110 走 |\n| 贾政 | 董事长 | 规矩、面子、替上一代还债 | 033 动手打儿子；105 查抄时只会说\"按程序\" |\n| 王夫人 | 人力与家族事务 | \"我都是为你好\" | 074 名单是她签的；107 \"我不配\" |\n| 贾赦 | 董事，长房 | 股份与分红 | 046 要鸳鸯；079 拿女儿换资金 |\n| 邢夫人 | 长房太太 | 丈夫的位置 | 046 替丈夫去说媒；071 争一个车位 |\n| 贾琏 | 副总 | 应酬、签字 | 106 十一本账；107 散资 |\n| 凤姐 | 执行总裁 | 能救火、能做局、能喝 | 072 \"我不能倒\"；113 托孤；114 死 |\n| 李纨 | 寡居 | 儿子是她的全部项目 | 088 之后无话 |\n| 元春 | 嫁出去的长姐 | 一个电话能救一笔贷款 | 095 一条推送 |\n| 迎春 | 被安排联姻的女儿 | 夫家的姓 | 079 一块鱼定终身 |\n| 探春 | 事业部负责人，庶出 | 做得比谁都好 | 100 自己报名远调 |\n| 惜春 | 插画师 | 不靠这个家 | 115 注销 |\n| 宝玉 | 唯一男丁 | 那块玉，和他名下的股权 | 094 玉丢了；096 假玉；117 \"这块在\" |\n| 黛玉 | 投亲的外孙女 | 老太太一句话 | 098 六点半的窗没开 |\n\n---\n\n## 二 · 三门外姓：薛、林、甄\n\n```mermaid\ngraph TD\n    XUE[\"薛姨妈\"] --> PAN[\"薛蟠 · 1985<br/>第085回判刑 · 服刑期间死亡（第103回提及）\"]\n    XUE --> BC[\"宝钗 · 1988<br/>第097回嫁宝玉\"]\n    PAN --- JIN[\"夏金桂<br/>第080回进门 · 第103回自焚\"]\n    PAN -.-> XIANG[\"香菱（英莲）· 1988<br/>买来的妾 · 第080回后无交代\"]\n\n    LIN[\"林如海（正文称“父亲”）<br/>苏州老国企中层\"] --- MIN[\"贾敏（正文称“母亲”）\"]\n    MIN --> DAI[\"黛玉\"]\n\n    ZHEN[\"甄士隐 · 老甄<br/>文学编辑 · 第120回归结\"] --> YING[\"英莲 · 1988<br/>第001回走失\"]\n    YING -.->|\"被转手三次\"| XIANG\n```\n\n### 2.1 薛家：一份\"配得上\"的资产\n\n- **薛姨妈**——宝钗、薛蟠之母。第004回带着儿子进京，为的是\"把这件事办得像没发生过\"。她说过一句最善意的空话（057：\"我看你两个倒像是天生的一对\"），没有兑现。\n- **薛蟠**——酒驾、打人、家里用钱摆平（第004、008回）。第047回被人痛打（\"多少钱，说个数\"），第085回终于判了，送去农场服刑。第080回娶夏金桂，第103回妻子自焚，他在服刑期间死亡，赔偿单上写着\"服刑期间死亡的补偿\"。\n- **夏金桂**——第080回进门，第一件事是立规矩\"谁的人，是谁的\"。第103回把两车嫁妆烧了，火起而没有退。正文写清她的错：电动车烧成铁架、二楼玻璃裂了、一个抱孩子的女人崴了脚。**她是受害者，也是加害者，两件事同时成立。**\n- **香菱（英莲）**——甄士隐的女儿，一岁走失，被转手三次（004），最后成了薛蟠的妾。第048回开始学写字、学拍照。第080回挨了七下，改口说\"是我偷的\"。**这是她在全书最后一次出现**；此后没有交代，正文有意不写。\n\n### 2.2 林家：一个父亲的决断\n\n- **林如海（正文只称\"父亲\"）**——苏州老国企中层，管过二三百人的车间。妻子走后一个人把女儿带到十九岁，没再娶。第002回他把女儿推出去：\"去北京。找你舅舅。\"\n- **贾敏（正文只称\"母亲\"）**——老太太的女儿。第002回留下一句\"以后少说话，多记着别人的好\"，隔一天走了。\n- **黛玉**——第003回拖着二十四寸的行李箱站在大厅，前台问她\"预约了吗\"。她与这个家的关系，从头到尾只有一条：**老太太的一句话**。那句话在第110回断了。\n\n### 2.3 甄家：一条从头到尾的线\n\n- **甄士隐（老甄）**——六十岁，做了三十年文学编辑，编过很多书，自己没写过一本。第001回女儿走失，此后十七年（到 2008 年前后），每年春天往南边去一趟，秋天再去一趟，七个本子记满线索。\n- **英莲**——1988 年生，1991 年走失，就是后来的香菱。\n- **父女这条线，全书只在两处接上**：第004回贾雨村翻过那一页（他知道，他没有说）；第120回老甄在拆迁咨询点坐了三天，只为看一眼名单——\"名单上没有她\"。\n- **老甄与贾雨村**：第001回借出一万二，没留借条。第120回雨村还钱，老甄说：\"你不是欠我一万二。你欠我一句话。\"\n\n---\n\n## 三 · 园子里的人：雇佣、依附、与\"没有位置\"\n\n```mermaid\ngraph LR\n    FENG[\"凤姐 · 执行总裁\"] -->|\"副手\"| PING[\"平儿 · 1984\"]\n    FENG -->|\"第006回 三千块\"| LIU[\"刘姥姥\"]\n    LIU -->|\"第113回 受托\"| QIAO[\"巧姐\"]\n    WANG[\"王仁 · 巧姐的舅舅<br/>正文只称“舅舅”\"] -.->|\"第118回 争监护权\"| QIAO\n    JIA[\"贾母\"] -->|\"秘书\"| YUAN[\"鸳鸯 · 1986<br/>第046回拒婚 · 第111回殉主\"]\n    BAO[\"宝玉\"] -.->|\"生活助理\"| XIREN[\"袭人\"]\n    BAO -.->|\"生活助理\"| QINGWEN[\"晴雯\"]\n    BAO -.->|\"第028回 转送的腰带\"| JIANG[\"一个唱戏的<br/>（原著蒋玉菡）\"]\n    JIANG ---|\"第119回 成婚\"| XIREN\n    DAI[\"黛玉\"] -.->|\"助理\"| ZIJUAN[\"紫鹃<br/>第057回“我不走了”\"]\n    HONG[\"小红\"] -.->|\"第024／026回\"| YUN[\"贾芸\"]\n```\n\n| 人 | 位置 | 关系实质 | 关键回 |\n|---|---|---|---|\n| 平儿 | 凤姐副手 | 替她挡事，也替她挨骂 | 021 瞒与救；044 一个生日打在最没有位置的人身上；118 \"我这样的人，能有个地方待着，就好了\" |\n| 鸳鸯 | 老太太秘书 | 全府唯一敢说实话的人 | 046 剪掉那张卡；111 把名字写进\"状况\"一栏 |\n| 袭人 | 宝玉生活助理 | 想把他留在系统里，因为她自己就是这么活着的 | 019 劝；096 假玉；117 \"这块在\"；119 嫁唱戏的 |\n| 晴雯 | 园区最能干的人 | 嘴利、手巧、不肯绕半步 | 031 撕扇；074 第一个被清退；077 门上两个字\"已走\" |\n| 小红 | 想往上走的小人物 | 全书写得最像今天年轻人的一个 | 024 一次越级汇报；026 一场没敲开的门 |\n| 贾芸 | 园子里跑事的 | 会来事，也肯干活 | 024 认亲戚；026 一场没敲开的门 |\n| 妙玉 | 开茶室的女居士 | 吃自己的，穿自己的，不拿这个家一分钱 | 041 三只杯子；一只搁下不再收；112 她的屋门上贴\"逾期视为放弃\" |\n| 刘姥姥 | 城郊种菜的 | 全书唯一一个把账还上的人 | 006 借钱；039 还账；113 受托；118 挡在门口 |\n| 巧姐 | 贾琏凤姐之女 | 全书唯一\"被接住\"的孩子 | 067 虎头鞋；113 带走；118 \"我妈不在\" |\n| 门岗 | 园区看门的老人 | 从头看到尾，一次也没进去过 | 071 一道闸；093 撕掉那张纸；094 玉丢了；115 \"你那个快递，还有两个没取\"；120 包裹寄回 |\n| 甄家旧仆 | 在甄家做了十九年的人 | 来求证\"这世上还有没有一个地方，认得那十九年\" | 093 投靠：一张 A4 纸、四块胶带印 |\n| 王仁 | 巧姐的舅舅 | 觉得自己在尽责 | 118 提两箱水果来\"接孩子\"：\"她不识字。这不算。\" |\n\n> **批** — 这一栏里的人，没有一个是\"下人\"。**今天的\"下人\"，叫外包、叫劳务、叫生活助理、叫项目制。** 名字换了，那件事没换：**一个人把十年的日子寄在一个地方，那个地方给他的最后一句话，是\"已走\"。**\n\n---\n\n## 四 · 六份名单\n\n全书六份名单，一份比一份短，一份比一份干净。**谁能被写进去，谁就是\"这个人还在\"；谁被划掉，谁就\"已处理\"。**\n\n| # | 回 | 名单 | 谁写 | 写什么 | 空白／划掉的地方 |\n|---|---|---|---|---|---|\n| 1 | 005 | 人事档案 | 集团人力 | 二十七人，每人一栏备注 | 宝玉那一栏空白，空了十一年 |\n| 2 | 074 | 专项核查名单 | 集团审计 | 二十七人，一间一间敲门 | \"查的是账，散的是人\" |\n| 3 | 105 | 遗物清单 | 清算组 | \"编号三，已故人员遗物\" | \"姓名\"一栏画了一道横线 |\n| 4 | 110 | 灵堂名单 | 家属自己 | 三十几个电话，来十一个人 | 摆七副碗筷，撤两副 |\n| 5 | 111 | 登记册 | 鸳鸯 | \"状况\"一栏，划掉几行写\"已处理\" | 最后一行是她自己的全名 |\n| 6 | 120 | 拆迁名单 | 拆迁办 | 一户一行：户主、面积、补偿、签字 | **\"名单上没有她\"** |\n\n**外加一份不成名单的名单**：第116回那张表的修订记录——十一年，一百三十七条，同一个账号。**不是命，是一个人午休时坐在电脑前，一条一条打上去的。**\n\n---\n\n## 五 · 关系的四种变形\n\n改写不换骨头，只换压力源。原著的关系到了今天，大多换了一个名字：\n\n| 原著关系 | 今天叫什么 | 压力源 | 正文例证 |\n|---|---|---|---|\n| 主仆 | 雇佣／外包／项目制 | 编制、社保、清退通知 | 074 二十七人名单；077 \"已走\" |\n| 父母之命 | 家族会议＋资金安排 | 担保、征信、股权 | 079 一块鱼定终身；097 四十七个项目 |\n| 妾 | \"没有仪式\"的同居 | 名分、房产证、一张证明 | 065 一把带机油味的钥匙；103 \"证明您和他确实是夫妻\" |\n| 托孤 | 监护权 | 户口、学区、手续 | 113 \"托给她\"；118 \"她不识字。这不算\" |\n| 抄家 | 集团内审／专项核查 | 合规、审计、\"不符合规定\" | 074 逐间敲门；105 封条翘了一角 |\n| 流放 | 服刑／外派 | 判决书、调令 | 085 \"送往某某农场服刑\"；100 五年外派 |\n| 出家 | 注销 | 身份系统、手机号 | 115 划掉\"谁也别找我\"，改成\"我很好\" |\n| 殉主 | 登记 | 一份\"状况\"栏 | 111 她把自己的名字写在最后一行 |\n| 还债 | 转账＋一句\"别跟人说\" | 没有借条 | 006 三千块；113 \"你妈给过我三千块\" |\n\n---\n\n## 六 · 二十组要紧的关系\n\n| 关系 | 正文怎么称呼 | 实质 | 起 | 终 |\n|---|---|---|---|---|\n| 贾母—宝玉 | 奶奶—孙子 | \"第三代就这一个男丁\" | 001 满月挂玉 | 110 她走时他背不出她的名字 |\n| 贾母—黛玉 | 外祖母—外孙女 | 一句话的庇护 | 003 \"你这眉眼，有点像你妈\" | 110 那句话断了 |\n| 贾政—宝玉 | 父—子 | 一个要面子的人和一个不要面子的人 | 003 | 117 他替这个家签了名（四页文件） |\n| 王夫人—宝玉 | 母—子 | \"我都是为你好\" | 003 | 107 \"我不配\"／\"我说配就配\" |\n| 王夫人—袭人 | 主子—眼线 | 一份工资买一双眼睛 | 019 劝 | 117 \"这块在\" |\n| 贾赦—鸳鸯 | 董事—秘书 | 一个六十岁的人忽然想做一件事 | 046 | 046 她剪了那张卡 |\n| 贾琏—凤姐 | 夫妻＝合作协议 | 各管一摊，各留一手 | 007 | 106 十一本账；114 她死 |\n| 凤姐—平儿 | 主—副手 | 替她挡事，也替她挨骂 | 021 | 118 \"我这样的人，能有个地方待着，就好了\" |\n| 凤姐—巧姐 | 母女 | \"你就说我不是个好人\" | 005 | 113 托给刘姥姥 |\n| 凤姐—刘姥姥 | 施舍—受惠 | 全书唯一还上的账 | 006 三千块 | 113 \"你妈给过我三千块\" |\n| 李纨—贾兰 | 寡母—独子 | 儿子是她的全部项目 | 005 | 088 之后无交代 |\n| 元春—贾家 | 长姐—资源 | 一个电话能救一笔贷款 | 016 高升 | 095 一条推送 |\n| 迎春—贾赦 | 父女 | 拿女儿换资金 | 079 一块鱼 | 109 二丫头死了 |\n| 探春—赵姨娘 | 生母—庶女 | 第一关是亲妈 | 055 | 100 她自己报名走的 |\n| 惜春—贾珍 | 兄妹（宁府） | 不靠这个家 | 017 题字 | 115 注销 |\n| 贾环—赵姨娘 | 母子 | 一个被教坏的孩子 | 025 投毒 | 118 拿\"处理决定\"当武器 |\n| 贾蓉—秦可卿 | 夫妻 | 一面镜子 | 010 病历 | 012 死，全家人说法不一 |\n| 薛蟠—香菱 | 夫—妾（买来的） | 七下之后她改口\"是我\" | 004 被转手进来 | 080 回挨打，此后无交代 |\n| 宝钗—宝玉 | 夫妻 | 一盒喜糖，四十七个项目 | 097 | 婚后各过 |\n| 老甄—贾雨村 | 债主—欠债人 | 一万二，和一句没说的话 | 001 | 120 \"你欠我一句话\" |\n\n---\n\n## 七 · 四个阶段：关系是怎么散的\n\n| 阶段 | 回次 | 关系靠什么维系 | 散的方式 |\n|---|---|---|---|\n| **入园** | 001—018 | 住在一起 | 各人从各处来，靠一顿饭、一份名单认识 |\n| **园中** | 019—060 | 一起做事 | 结社、建群、承包、凑份子——**关系最密的时候，账也最清** |\n| **散** | 061—110 | 名单 | 一个一个被划掉：清退、外派、服刑、病故、注销 |\n| **空** | 111—120 | 记不记得 | 人还在，关系没了；只剩一个人还在一行一行地写备注 |\n\n**一句话**：前六十回，人与人是\"认识的\"；后六十回，人与人是\"有备注的\"。\n\n---\n\n## 八 · 没有结成的关系（全书留白）\n\n这些关系，正文有意不写圆满。**不是忘了，是不肯。**\n\n| 关系 | 差在哪一步 | 回 |\n|---|---|---|\n| 宝玉—黛玉 | 一句\"我们\"始终没有说成 | 032 三个字说出口，同一天另一头有人没了；098 她死 |\n| 宝玉—宝钗 | 婚成了，人没成 | 097 一盒喜糖 |\n| 宝玉—袭人 | 她护的是一块假玉 | 096、117 |\n| 宝玉—晴雯 | 一件补了一夜的衣服 | 052、077 |\n| 老甄—女儿 | 1997 年找到那个院子，在门口站了一个下午，**没有敲门** | 120 |\n| 老甄—贾雨村 | 不是父女，是\"那一页\" | 120 |\n| 妙玉—宝玉 | 三只杯子，一只搁下不再收 | 040、041 |\n| 探春—这个家 | 走了，没有回来 | 100 |\n| 湘云 | 第076回之后不再出现，**没有交代** | 076 |\n| 香菱 | 第080回之后不再出现，**没有交代** | 080 |\n| 贾兰 | 第088回之后不再出现，**没有交代** | 088 |\n| 巧姐—母亲 | 孩子在楼下抬头，说了一声\"哦\" | 113、118 |\n\n> **批** — 长篇写到结尾，最容易犯的错，是替所有人把话说圆。**说圆了，就假了。** 这本书里最好的一些人，最后都没有下落——因为真实的下落，本来就不成句子。\n\n---\n\n## 九 · 谁记得谁\n\n全书最后剩下的那个问题，不是\"谁还活着\"，是\"谁还记得\"。\n\n| 被记得的人 | 记得他的人 | 怎么记得 |\n|---|---|---|\n| 黛玉 | 宝玉、紫鹃、一个跟过她的姑娘 | 097 一盒喜糖；117 替他收拾箱子 |\n| 晴雯 | 宝玉 | 078 一篇诔，撕了又用胶带粘上 |\n| 凤姐 | 刘姥姥 | 113 那三千块，\"你妈给过我三千块\" |\n| 香菱 | 老甄 | 七个本子；120 \"名单上没有她\" |\n| 鸳鸯 | 登记册 | 111 一行\"已处理\"，和一个全名 |\n| 元春 | 一条推送 | 095 一行字：因病医治无效 |\n| 可卿 | 没有 | 012 之后，全家没有人再提 |\n| 迎春 | 没有 | 109 一道横线 |\n| 妙玉 | 一盆还活着的植物 | 112 屋子清空，花没人管 |\n| 老太太 | 摆碗筷的人 | 110 第二天早上，少摆一副 |\n\n> **批** — 这本书里，凡被这个家扔掉的人，最后记得他们的，都是那个不被看重的人。**这不是安排，这是规律。**\n\n---\n\n## 十 · 一页速查\n\n- **中心**：宝玉（1989，第三代唯一男丁，一块玉＝一份股权）\n- **两房**：长房贾赦（只分钱）／二房贾政（掌实权）\n- **精神股东**：贾母（不持股，一句话定生死）\n- **执行者**：凤姐（能救火的人，最后被火救不了）\n- **外来者**：黛玉（投亲）、宝钗（入京）、湘云（家早败了）、妙玉（租在最偏的角落）\n- **被买来的人**：香菱（转手三次）、袭人（想把他留在系统里）\n- **被划掉的人**：晴雯（077）、迎春（109）、元春（095）、鸳鸯（111）、凤姐（114）、惜春（115）\n- **唯一还上账的人**：刘姥姥\n- **从头看到尾、一次也没进去的人**：门岗\n- **从头到尾都在算账的人**：贾雨村\n- **从头到尾都在找一个人的人**：老甄\n- **最后记得所有人的那个人**：宝玉——**他一个名字也没记住，他只记住了二十六个人喜欢什么。**\n\n---\n\n*本图谱据正文一百二十回编成，凡引原著处皆凭记忆，未逐字核对版本。*\n";
